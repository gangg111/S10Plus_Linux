# startplasmamobile starts this unit in the systemd user manager, which has no
# WAYLAND_DISPLAY and another D-Bus bus than the plamo-wf session
# (dbus-run-session); there the portal falls back to xcb and aborts.  The
# portal the applications use is started by D-Bus activation on the session
# bus, so this copy is only skipped.
[Unit]
ConditionEnvironment=WAYLAND_DISPLAY
