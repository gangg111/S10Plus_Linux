# Merged by ofono over /etc/ofono/binder.conf of ofono-configs-binder-common
# (ofono_conf_merge_files reads binder.d/*.conf after the main file).
#
# S10+: the binder plugin turns the signal strength from dBm into a percentage
# through this range.  The default mapped real LTE (about -103 dBm) to 1%, so the
# signal triangle in the status bar stayed empty.  -120 dBm = 0%, -80 dBm and
# stronger = 100% (the usual LTE RSRP scale).  Measured on the phone: -105 dBm -> 37%.
[slot1]
signalStrengthRange = -120, -80
