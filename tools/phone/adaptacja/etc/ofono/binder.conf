[Settings]
ExpectSlots = slot1

[slot1]
path = /ril_0
slot = 0
# S10+: wtyczka binder przelicza sile sygnalu z dBm na procent przez ten zakres.
# Domyslny mapowal realne LTE (okolo -103 dBm) na 1%, przez co trojkat sygnalu
# w pasku stanu byl pusty. -120 dBm = 0%, -80 dBm i mocniej = 100% (typowa skala
# LTE RSRP). Zmierzone na telefonie: -105 dBm -> 37%.
signalStrengthRange = -120, -80
