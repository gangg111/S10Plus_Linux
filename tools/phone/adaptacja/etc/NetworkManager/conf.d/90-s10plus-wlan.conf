# Galaxy S10+: sterownik Wi-Fi Broadcoma wystawia trzy interfejsy.
# - wlan0: wlasciwa karta z fabrycznym adresem MAC (z /mnt/vendor/efs/wifi);
# - wlan1: druga instancja z adresem losowanym przy kazdym starcie; gdy NetworkManager
#   laczyl sie przez nia, telefon dostawal po kazdym restarcie inny adres IP;
# - p2p0: interfejs Wi-Fi Direct, ktory NetworkManager bral za Ethernet i co kilkadziesiat
#   sekund probowal na nim DHCP ("Wired connection 1").
# NetworkManager zarzadza wiec tylko wlan0.
[keyfile]
unmanaged-devices=interface-name:wlan1;interface-name:p2p0
