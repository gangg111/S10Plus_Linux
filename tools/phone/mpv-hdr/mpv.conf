# Mali-G76 (panfrost): domyslny gpu-next (libplacebo) nie trzyma 1080p60
# nawet przy GPU na 702 MHz (ok. 30 kl/s); vo=gpu z profilem fast daje
# 60 kl/s przy GPU na 156 MHz. Pomiar 24.09.2026, measurements/2026-09-24-obciazenie.
vo=gpu
profile=fast

# HDR10, HDR10+ i HLG: gpu-next mapuje tony dynamicznie (ST 2094-40 z metadanych
# HDR10+) do szczytu panelu 800 nitow i podaje KWin opis obrazu BT.2020/PQ,
# a KWin podbija panel (EDR) z 420 do 800 nitow. Wymaga mpv z latka
# tools/phone/mpv-hdr (powierzchnia koloru Wayland takze dla gpu-next).
# Wlacza go scripts/hdr-auto.lua przed otwarciem pliku; profile-cond nie
# nadaje sie, bo zmiana vo zeruje video-params i profil przelacza sie w petli.
[hdr]
profile-desc=HDR10/HDR10+/HLG na panelu 800 nitow
profile-restore=copy
vo=gpu-next
egl-output-format=rgb10_a2
target-colorspace-hint=yes
target-colorspace-hint-mode=source-dynamic
target-colorspace-hint-strict=no
target-trc=pq
target-prim=bt.2020
target-peak=800
tone-mapping=st2094-40
hdr-compute-peak=no
