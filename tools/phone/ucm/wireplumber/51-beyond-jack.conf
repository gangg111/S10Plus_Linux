# Sluchawki i glosniki to osobne urzadzenia PCM (hw:0,1 i hw:0,0), wiec priorytet
# portu z UCM (400 nad 300) nie przechodzi na wezly: WirePlumber dawal glosnikom
# priority.session 1000, sluchawkom 728, i po wlozeniu wtyczki dzwiek zostawal
# w glosnikach.  Wezel sluchawek dostaje wyzszy priorytet; gdy wtyczki nie ma,
# jego port jest niedostepny i WirePlumber zostaje przy glosnikach.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_output.platform-sound.HiFi__Headphones__sink" } ]
    actions = { update-props = { priority.session = 1100, priority.driver = 1100 } }
  }
  {
    matches = [ { node.name = "alsa_input.platform-sound.HiFi__Headset__source" } ]
    actions = { update-props = { priority.session = 2100, priority.driver = 2100 } }
  }
]
