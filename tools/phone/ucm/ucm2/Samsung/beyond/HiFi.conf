# Galaxy S10+ (beyond2lte): the card of patches 0130-0135 and 0138.
#   PCM 0: UAIF1, the two CS35L40 amplifiers (left earpiece, right bottom)
#   PCM 1: UAIF0, the CS47L93 codec: DMIC1 on IN3, DMIC2 on IN4,
#          headset microphone on IN1B, headphones on HPOUT2

SectionVerb {
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},0"
	}
}

# The jack of patch 0138 marks the port unavailable while the socket is
# empty; a plug takes over from the speakers, as on Android.
SectionDevice."Headphones" {
	Comment "Headphones"

	EnableSequence [
		cset "name='HPOUT2L Input 1' AIF1RX1"
		cset "name='HPOUT2R Input 1' AIF1RX2"
		cset "name='HPOUT2 Digital Switch' on,on"
	]

	DisableSequence [
		cset "name='HPOUT2 Digital Switch' off,off"
		cset "name='HPOUT2L Input 1' None"
		cset "name='HPOUT2R Input 1' None"
	]

	Value {
		PlaybackPriority 400
		PlaybackPCM "hw:${CardId},1"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphones"

	ConflictingDevice [
		"Headset"
	]

	EnableSequence [
		cset "name='AIF1TX1 Input 1' IN3L"
		cset "name='AIF1TX2 Input 1' IN4L"
	]

	DisableSequence [
		cset "name='AIF1TX1 Input 1' None"
		cset "name='AIF1TX2 Input 1' None"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"

	ConflictingDevice [
		"Mic"
	]

	EnableSequence [
		cset "name='IN1L Analog Mux' B"
		cset "name='AIF1TX1 Input 1' IN1L"
		cset "name='AIF1TX2 Input 1' IN1L"
	]

	DisableSequence [
		cset "name='AIF1TX1 Input 1' None"
		cset "name='AIF1TX2 Input 1' None"
	]

	Value {
		CapturePriority 300
		CapturePCM "hw:${CardId},1"
		JackControl "Headset Mic Jack"
	}
}
