# Tlumienie echa i szumu dla rozmow (jak przetwarzanie glosu w Androidzie).
# Odniesieniem jest monitor domyslnego wyjscia: co gra z glosnikow, to modul
# odejmuje z mikrofonu.  Wbudowany mikrofon zostaje surowy dla nagran.
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            monitor.mode = true
            node.latency = 1024/48000
            aec.args = {
                webrtc.high_pass_filter = true
                webrtc.noise_suppression = true
                webrtc.gain_control = true
                webrtc.extended_filter = true
                webrtc.delay_agnostic = true
            }
            capture.props = {
                node.name = "capture.echo-cancel"
                node.passive = true
            }
            source.props = {
                node.name = "echo-cancel-source"
                node.description = "Mikrofon do rozmow (bez echa i szumu)"
                priority.session = 150
            }
        }
    }
]
