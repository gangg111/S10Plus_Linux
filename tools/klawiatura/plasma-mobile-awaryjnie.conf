# Nakladka na plasma-mobile.service: /etc/systemd/system/plasma-mobile.service.d/50-awaryjnie.conf
#
# Dotyk moze zastac tryb niskiego poboru (bez wspolrzednych), jesli ostatnim
# wlascicielem byla klawiatura ekranowa i zgasila ekran.  Zerujemy go przed
# kazdym startem sesji; '-' z przodu, bo brak pliku (inny uklad dotyku)
# nie moze zatrzymac Plasmy, a '+', bo sesja chodzi jako user.
#
# Panel moze zastac wylaczony komenda 0x28 (lcd_power rozne od 0), bo
# klawiatura zgasila konsole przed startem sesji.  Zmierzone 23.09.2026:
# KWin wstal, kompozycja OpenGL dzialala, a ekran byl czarny, bo pod
# sesja graficzna konsola nie dostaje juz odgaszenia i nikt nie wysyla
# 0x29.  Zapis 0 wysyla ja zawsze, takze gdy panel juz swieci.
#
# Gdy Plasma padnie na dobre (limit restartow), wraca konsola z klawiatura,
# zeby telefon dalo sie obsluzyc bez komputera.

[Unit]
OnFailure=klawiatura.service

[Service]
ExecStartPre=-+/bin/sh -c 'echo 0 > /sys/bus/i2c/devices/0-0048/lowpower'
ExecStartPre=-+/bin/sh -c 'echo 0 > /sys/class/lcd/exynos9820-dsim/lcd_power'
